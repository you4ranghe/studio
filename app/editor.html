<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편집기 — 스튜디오</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body data-pane="form">

<div class="app">

  <header class="top">
    <a class="mark" href="./index.html" style="color:inherit; text-decoration:none">
      <span class="chip">?</span> 스튜디오
    </a>
    <span class="sep"></span>
    <span class="doc" id="doc">불러오는 중…</span>
    <span class="spacer"></span>
    <span class="saved" id="saved">저장됨</span>
    <button class="btn btn--ghost" id="reset" type="button">샘플로 되돌리기</button>
    <button class="btn btn--primary" id="dl" type="button">HTML 내려받기</button>
  </header>

  <nav class="swap">
    <button id="tabForm" type="button" aria-selected="true">편집</button>
    <button id="tabPrev" type="button" aria-selected="false">미리보기</button>
    <select class="inp stepsel" id="stepSel" style="width:auto; height:30px; padding:0 8px"></select>
  </nav>

  <aside class="rail">
    <div class="cap">STAGE</div>
    <div id="stages"></div>
    <div class="foot">
      <div class="meter"><i id="meterBar"></i></div>
      <p id="meterTxt">준비 중</p>
    </div>
  </aside>

  <main class="form">
    <div class="form__inner">
      <div class="stephead">
        <div class="eyebrow pix" id="eyebrow"></div>
        <h1 id="stepTitle">불러오는 중</h1>
        <p id="stepDesc"></p>
      </div>

      <div id="fields"></div>

      <div class="markup" id="markup" hidden></div>

      <div class="steps">
        <button class="btn" id="stepPrev" type="button">← 이전</button>
        <span class="grow"></span>
        <button class="btn btn--primary" id="stepNext" type="button">다음 →</button>
      </div>
    </div>
  </main>

  <section class="prev">
    <div class="prev__frame">
      <div class="prev__box">
        <iframe id="frame" title="결과물 미리보기"></iframe>
      </div>
    </div>
    <div class="prev__bar">
      <button class="prev__nav" id="pPrev" type="button" aria-label="이전 장">◀</button>
      <span class="prev__pos pix" id="pPos">-- / --</span>
      <button class="prev__nav" id="pNext" type="button" aria-label="다음 장">▶</button>
      <span class="prev__now" id="pNow">미리보기를 준비하고 있습니다</span>
      <button class="prev__open" id="pOpen" type="button">새 탭에서 열기</button>
    </div>
  </section>

</div>

<script type="module" src="./js/editor.js"></script>
</body>
</html>
