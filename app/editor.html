<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편집기 — 스튜디오</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" as="font" type="font/woff2" href="./assets/fonts/PretendardVariable.woff2" crossorigin>
<link rel="stylesheet" href="./css/app.css">
<script>
  /* 깜빡임 없이 테마를 먼저 적용합니다 */
  (() => {
    const s = localStorage.getItem('studio:theme');
    const d = matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = s || (d ? 'dark' : 'light');
  })();
</script>
</head>
<body data-pane="form">

<svg class="sr" aria-hidden="true">
  <symbol id="i-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 8 5.5l4 4"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 8 10.5l4-4"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 11 8l-4.5 4.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linejoin="round"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z"/></symbol>
</svg>

<div class="app">

  <header class="top">
    <a class="brand" href="./index.html"><span class="brand__m">?</span>스튜디오</a>
    <span class="top__doc" id="doc">불러오는 중</span>
    <span class="top__sp"></span>
    <span class="state" id="state">저장됨</span>
    <button class="btn btn--icon" id="theme" type="button" aria-label="화면 밝기 바꾸기">
      <svg class="ico" id="themeIco"><use href="#i-moon"/></svg>
    </button>
    <button class="btn btn--quiet" id="reset" type="button">샘플로 되돌리기</button>
    <button class="btn btn--primary" id="dl" type="button">HTML 내려받기</button>
  </header>

  <nav class="tabs">
    <button id="tabForm" type="button" aria-selected="true">편집</button>
    <button id="tabStage" type="button" aria-selected="false">미리보기</button>
    <select id="jump" aria-label="장면으로 이동"></select>
  </nav>

  <aside class="rail">
    <div class="rail__scroll" id="rail"></div>
    <div class="rail__foot">
      <div class="prog">
        <div class="prog__bar"><i id="progBar"></i></div>
        <span class="prog__n px" id="progN">0%</span>
      </div>
      <p id="progT">준비 중</p>
    </div>
  </aside>

  <main class="form" id="form">
    <div class="form__in" id="sections"></div>
  </main>

  <section class="stage">
    <div class="stage__glow" id="glow"></div>
    <div class="stage__wrap">
      <div class="stage__col">
      <div class="stage__box"><iframe id="frame" title="결과물 미리보기"></iframe></div>
    <div class="bar">
      <button class="bar__b" id="pPrev" type="button" aria-label="이전 장">
        <svg class="ico"><use href="#i-prev"/></svg></button>
      <span class="bar__p" id="pPos">-- / --</span>
      <button class="bar__b" id="pNext" type="button" aria-label="다음 장">
        <svg class="ico"><use href="#i-next"/></svg></button>
      <span class="bar__n" id="pNow">미리보기를 준비하고 있습니다</span>
      <button class="bar__o" id="pOpen" type="button">새 탭에서 열기</button>
      </div>
      </div>
    </div>
  </section>

</div>

<script type="module" src="./js/editor.js"></script>
</body>
</html>
